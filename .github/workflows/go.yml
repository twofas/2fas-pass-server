name: Go

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop"]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Test if go.mod and go.sum are up to date
        run: |
          go mod tidy
          (cd tools && go mod tidy)
          git diff --exit-code
      - name: Check if licences are up to date
        run: |
          set -euo pipefail
          make licenses
          git diff --exit-code
      - name: Check if licence headers are up to date
        run: |
          make check-license-headers
      - name: Check if code is formatted
        run: |
          make format
          git diff --exit-code
      - name: Check if conformant to go fix
        run: |
          go fix ./...
          git diff --exit-code
      - name: Run linters
        run: make go-lint
      - name: Unit Test once (to catch simple errors early)
        run: go test -race ./...
      - name: Unit Test multiple times (to catch flakely tests)
        run: go test -race -count 200 -failfast ./...
      - name: Build
        run: go build ./...
      - name: E2E
        run: |
          go run main.go &
          RUN_E2E_TESTS=true go test ./e2e/... -v -count=1
