version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      all-gomod-updates:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/tools"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      all-tools-updates:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
